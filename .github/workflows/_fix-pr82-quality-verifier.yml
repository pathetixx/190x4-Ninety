name: Fix PR 82 quality verifier

on:
  push:
    branches:
      - revert/pr75-dataplane-watchdog
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'revert/pr75-dataplane-watchdog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revert/pr75-dataplane-watchdog
      - name: Restore independent quality remediation verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main.js")
          text = path.read_text(encoding="utf-8")
          marker = "\nfunction safeSourceSwitchReason(reason) {"
          if text.count(marker) != 1:
              raise SystemExit("safeSourceSwitchReason marker not unique")
          helper = "".join([
              "\nasync function verifyRuntimeOperationDataplane(operationToken) {\n",
              "  if (!operationToken) return false;\n",
              "  try {\n",
              "    const snapshot = await invoke(\"runtime_snapshot\");\n",
              "    runtimeSnapshotCache = runtimeEndpointMatchesGeneration(snapshot) ? snapshot : null;\n",
              "    if (!snapshot?.running || !Number(snapshot.processGeneration)) return false;\n",
              "    const verdict = await invoke(\"verify_runtime_dataplane\", {\n",
              "      operationToken,\n",
              "      expectedGeneration: snapshot.processGeneration,\n",
              "    });\n",
              "    return verdict?.status === \"ready\";\n",
              "  } catch {\n",
              "    return false;\n",
              "  }\n",
              "}\n",
          ])
          path.write_text(text.replace(marker, helper + marker, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/_fix-pr82-quality-verifier.yml
          git add -A
          git commit -m "fix: retain quality remediation verifier"
          git push origin HEAD:revert/pr75-dataplane-watchdog
