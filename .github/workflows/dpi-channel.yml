name: DPI channel (Flowseal sync)

# Signed data-channel publisher. Scheduled runs consume only immutable GitHub
# releases whose ZIP carries a GitHub-provided SHA-256 digest. Manual runs may
# still pin an exact tag/checksum or use the reviewed SourceForge fallback.
# gen_strategies.py fail-closed validates the elevated winws argument allowlist,
# then the job collects strategies.json, lists and bounded .bin payloads,
# signs the bundle and publishes it to the `dpi-channel` prerelease. Ninety pulls
# this bundle on the fly, verifies the signature and applies it — WITHOUT an app
# update. service/hosts and service/ipset-service.txt follow the same immutable
# release as the strategies: they are read from the commit the release tag peels
# to, so the whole channel stays current without a manual review step. They used
# to lag behind on manually reviewed, separately pinned Git blobs. Since hosts
# data lands in the system hosts file, the freshness is paid for with a
# fail-closed shape check instead (see "Validate service data"): public unicast
# targets only, so a compromised upstream cannot point a domain at a machine on
# the user LAN or blackhole it, and no unbounded or malformed input gets our
# signature. Hijacking a domain to another public host is NOT covered — that
# would need a reviewed domain allowlist, which is what pinning used to be.
# The engine (winws.exe/WinDivert) is NOT touched here — it ships via the signed
# OTA release (see engine-watch.yml: watches bol-van/zapret-win-bundle, PR).
#
# prerelease=true matters: dpi-channel must NOT become "Latest", otherwise it
# would shadow the app updater endpoint (releases/latest/download/latest.json).

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Exact reviewed Flowseal tag (empty = latest immutable release)"
        required: false
        type: string
      upstream_source:
        description: "Manual source (scheduled/latest mode is GitHub-only)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - github
          - sourceforge
      archive_sha256:
        description: "Reviewed archive SHA-256 (required with an explicit tag)"
        required: false
        type: string
      service_archive_sha256:
        description: "Reviewed source SHA-256 to override pinned service manifest"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dpi-channel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve immutable Flowseal source
        id: fl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SOURCE: ${{ inputs.upstream_source }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          SERVICE_ARCHIVE_SHA256: ${{ inputs.service_archive_sha256 }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          requested="${REQUESTED_SOURCE:-auto}"
          expected="${ARCHIVE_SHA256:-}"
          [[ "$requested" = auto || "$requested" = github || "$requested" = sourceforge ]] || { echo "::error::invalid upstream_source"; exit 1; }

          source=""
          sha=""
          archive_url=""
          automatic=false

          # schedule or empty manual tag: latest immutable GitHub release only.
          # Fail closed when GitHub does not provide an asset digest.
          if [ "$EVENT_NAME" = schedule ] || [ -z "$tag" ]; then
            [ "$requested" != sourceforge ] || { echo "::error::latest mode cannot use SourceForge"; exit 1; }
            release=$(gh api repos/Flowseal/zapret-discord-youtube/releases/latest)
            [ "$(jq -r .immutable <<<"$release")" = true ] || { echo "::error::latest Flowseal release is not immutable"; exit 1; }
            [ "$(jq -r .draft <<<"$release")" = false ] || { echo "::error::latest Flowseal release is a draft"; exit 1; }
            [ "$(jq -r .prerelease <<<"$release")" = false ] || { echo "::error::latest Flowseal release is a prerelease"; exit 1; }
            tag=$(jq -r .tag_name <<<"$release")
            [[ "$tag" =~ ^[0-9]+(\.[0-9A-Za-z]+)*$ ]] || { echo "::error::invalid automatic upstream version tag"; exit 1; }
            asset_name="zapret-discord-youtube-${tag}.zip"
            asset=$(jq -c --arg name "$asset_name" '.assets[] | select(.name == $name)' <<<"$release")
            [ -n "$asset" ] || { echo "::error::release asset $asset_name not found"; exit 1; }
            archive_url=$(jq -r .browser_download_url <<<"$asset")
            digest=$(jq -r .digest <<<"$asset")
            [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::GitHub release asset has no SHA-256 digest"; exit 1; }
            expected="${digest#sha256:}"
            source=github
            automatic=true
          else
            [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid upstream tag"; exit 1; }
            [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::archive_sha256 must be 64 hex chars for an explicit tag"; exit 1; }
            github_ok=false
            if [ "$requested" != sourceforge ]; then
              archive_url="https://github.com/Flowseal/zapret-discord-youtube/releases/download/${tag}/zapret-discord-youtube-${tag}.zip"
              if curl -fsIL --max-time 20 "$archive_url" >/dev/null 2>&1; then github_ok=true; fi
            fi
            if [ "$github_ok" = true ]; then
              source=github
            elif [ "$requested" = github ]; then
              echo "::error::requested GitHub source is unavailable"; exit 1
            else
              source=sourceforge
              archive_url="https://sourceforge.net/projects/flowseal.mirror/files/${tag}/zapret-discord-youtube-${tag}.zip/download"
              curl -fsIL --max-time 20 "$archive_url" >/dev/null 2>&1 || { echo "::error::SourceForge archive is unavailable"; exit 1; }
            fi
          fi

          # Resolve the tag to an immutable commit for audit notes and optional
          # exact-version source access. SourceForge has no Git commit binding.
          if [ "$source" = github ]; then
            obj=$(gh api "repos/Flowseal/zapret-discord-youtube/git/ref/tags/$tag")
            type=$(jq -r .object.type <<<"$obj")
            sha=$(jq -r .object.sha <<<"$obj")
            if [ "$type" = tag ]; then
              sha=$(gh api "repos/Flowseal/zapret-discord-youtube/git/tags/$sha" --jq .object.sha)
            fi
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::failed to peel upstream tag"; exit 1; }
          fi
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::resolved archive SHA-256 is invalid"; exit 1; }

          # Scheduled/latest mode may advance or republish the same version, but
          # never auto-sign a downgrade if upstream deletes/moves its Latest.
          # Exact manual tag+checksum remains the explicit rollback mechanism.
          if [ "$automatic" = true ] && gh release view dpi-channel --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            current_candidates=()
            if downloaded_version=$(gh release download dpi-channel --repo "$GITHUB_REPOSITORY" \
              --pattern version.txt --output - 2>/dev/null); then
              asset_current=$(printf '%s' "$downloaded_version" | tr -d '\r\n')
              if [[ "$asset_current" =~ ^[A-Za-z0-9._-]+$ ]]; then
                current_candidates+=("$asset_current")
              fi
            fi
            # Самовосстановление после оборванного release upload: notes
            # записываются до assets и остаются monotonic record, даже если
            # version.txt ещё не успел загрузиться. Берём максимальную из двух
            # валидных версий, поэтому старый asset не ослабляет новый record.
            notes_current=$(gh release view dpi-channel --repo "$GITHUB_REPOSITORY" \
              --json body --jq .body | tr ' ' '\n' | sed -n 's/^flowseal=//p')
            if [[ "$notes_current" =~ ^[A-Za-z0-9._-]+$ ]]; then
              current_candidates+=("$notes_current")
            fi
            [ "${#current_candidates[@]}" -gt 0 ] || { echo "::error::invalid current channel version"; exit 1; }
            current=$(printf '%s\n' "${current_candidates[@]}" | LC_ALL=C sort -V | tail -1)
            first=$(printf '%s\n%s\n' "$current" "$tag" | LC_ALL=C sort -V | sed -n '1p')
            [ "$first" = "$current" ] || { echo "::error::automatic DPI channel downgrade blocked: $current -> $tag"; exit 1; }
          fi

          service_mode=commit
          if [ "$source" = sourceforge ] || [ -n "${SERVICE_ARCHIVE_SHA256:-}" ]; then
            service_mode=archive
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "archive_url=$archive_url" >> "$GITHUB_OUTPUT"
          echo "automatic=$automatic" >> "$GITHUB_OUTPUT"
          echo "service_mode=$service_mode" >> "$GITHUB_OUTPUT"
          echo "service_sha=${SERVICE_ARCHIVE_SHA256:-}" >> "$GITHUB_OUTPUT"
          echo "Flowseal source = $source tag=$tag commit=${sha:-none} archive_sha256=$expected automatic=$automatic service_mode=$service_mode"

      - name: Download and unpack the release
        env:
          ARCHIVE_URL: ${{ steps.fl.outputs.archive_url }}
          EXPECTED_SHA256: ${{ steps.fl.outputs.expected }}
          UPSTREAM_SOURCE: ${{ steps.fl.outputs.source }}
          UPSTREAM_TAG: ${{ steps.fl.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o fl.zip "$ARCHIVE_URL"
          archive_size=$(stat -c '%s' fl.zip)
          [ "$archive_size" -gt 0 ] && [ "$archive_size" -le 67108864 ] || { echo "::error::release archive exceeds 64 MiB"; exit 1; }
          echo "$EXPECTED_SHA256  fl.zip" | sha256sum --check --strict
          python3 - fl.zip <<'PY'
          import stat, sys, zipfile
          path = sys.argv[1]
          limit = 200 * 1024 * 1024
          with zipfile.ZipFile(path) as z:
              total = 0
              for info in z.infolist():
                  name = info.filename.replace('\\', '/')
                  if name.startswith('/') or name.startswith('../') or '/../' in name or name == '..':
                      raise SystemExit(f'path traversal in archive: {info.filename}')
                  mode = info.external_attr >> 16
                  if mode and stat.S_IFMT(mode) not in (0, stat.S_IFREG, stat.S_IFDIR):
                      raise SystemExit(f'non-regular entry in archive: {info.filename}')
                  total += info.file_size
                  if total > limit:
                      raise SystemExit('archive uncompressed size exceeds 200 MiB')
          PY
          mkdir -p fl && unzip -q fl.zip -d fl
          # .bat files live in the zip root; normalize to the dir with general*.bat
          general=$(find fl -type f -iname 'general.bat' -print -quit)
          d=$(dirname "$general")
          expected_root="fl/zapret-discord-youtube-$UPSTREAM_TAG"
          [ "$d" = "$expected_root" ] || { echo "::error::unexpected release root or missing general.bat"; exit 1; }
          echo "FL_DIR=$d" >> "$GITHUB_ENV"
          echo "source=$UPSTREAM_SOURCE" >> "$GITHUB_ENV"

      - name: Load service data from the resolved release commit
        if: ${{ steps.fl.outputs.service_mode == 'commit' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_COMMIT: ${{ steps.fl.outputs.sha }}
        run: |
          set -euo pipefail
          # .service/ is not shipped inside the release ZIP, so it comes from the
          # repository at the commit this release tag peels to — the same
          # immutable point the strategies were built from, never a moving ref.
          repo="Flowseal/zapret-discord-youtube"
          commit="$UPSTREAM_COMMIT"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid resolved upstream commit"; exit 1; }
          mkdir -p "$FL_DIR/.service"
          for f in hosts ipset-service.txt; do
            blob=$(gh api "repos/$repo/contents/.service/$f?ref=$commit" --jq .sha)
            [[ "$blob" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$f is missing at $commit"; exit 1; }
            gh api "repos/$repo/git/blobs/$blob" --jq .content | tr -d '\n' | base64 --decode > "$FL_DIR/.service/$f"
            # Transport integrity: the bytes we wrote must hash back to the blob
            # the tree points at.
            actual=$(git hash-object "$FL_DIR/.service/$f")
            [ "$actual" = "$blob" ] || { echo "::error::Git blob mismatch for $f"; exit 1; }
          done
          echo "Service data = $repo @ $commit"

      - name: Download reviewed exact-version service archive
        if: ${{ steps.fl.outputs.service_mode == 'archive' }}
        env:
          SERVICE_SHA256: ${{ inputs.service_archive_sha256 }}
          UPSTREAM_SOURCE: ${{ steps.fl.outputs.source }}
          UPSTREAM_TAG: ${{ steps.fl.outputs.tag }}
          UPSTREAM_COMMIT: ${{ steps.fl.outputs.sha }}
        run: |
          set -euo pipefail
          service_sha="$SERVICE_SHA256"
          if [ -z "$service_sha" ]; then
            echo "::error::release ZIP lacks guaranteed .service; service_archive_sha256 is required"; exit 1
          fi
          [[ "$service_sha" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::invalid service_archive_sha256"; exit 1; }
          if [ "$UPSTREAM_SOURCE" = sourceforge ]; then
            service_url="https://sourceforge.net/projects/flowseal.mirror/files/${UPSTREAM_TAG}/${UPSTREAM_TAG}%20source%20code.zip/download"
          else
            service_url="https://github.com/Flowseal/zapret-discord-youtube/archive/${UPSTREAM_COMMIT}.zip"
          fi
          curl -fsSL --max-time 120 -o service.zip "$service_url"
          service_size=$(stat -c '%s' service.zip)
          [ "$service_size" -gt 0 ] && [ "$service_size" -le 67108864 ] || { echo "::error::service archive exceeds 64 MiB"; exit 1; }
          echo "$service_sha  service.zip" | sha256sum --check --strict
          python3 - service.zip <<'PY'
          import stat, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              total = 0
              for info in z.infolist():
                  name = info.filename.replace('\\', '/')
                  if name.startswith('/') or name.startswith('../') or '/../' in name or name == '..':
                      raise SystemExit(f'path traversal in service archive: {info.filename}')
                  mode = info.external_attr >> 16
                  if mode and stat.S_IFMT(mode) not in (0, stat.S_IFREG, stat.S_IFDIR):
                      raise SystemExit(f'non-regular entry in service archive: {info.filename}')
                  total += info.file_size
                  if total > 200 * 1024 * 1024:
                      raise SystemExit('service archive uncompressed size exceeds 200 MiB')
          PY
          mkdir -p service-src && unzip -q service.zip -d service-src
          service_root=$(find service-src -type d -name .service -print -quit)
          [ -n "$service_root" ] || { echo "::error::.service directory missing from exact-version source archive"; exit 1; }
          mkdir -p "$FL_DIR/.service"
          cp "$service_root/hosts" "$FL_DIR/.service/hosts"
          cp "$service_root/ipset-service.txt" "$FL_DIR/.service/ipset-service.txt"

      - name: Validate service data
        run: |
          set -euo pipefail
          python3 - "$FL_DIR/.service" <<'PY'
          # Fail-closed shape check. These two files are the only channel content
          # that touches the system outside winws: hosts is written into the
          # Windows hosts file, ipset-service.txt selects which destinations the
          # service profile desyncs. Upstream is no longer manually reviewed, so
          # anything that is not plainly a public-unicast bypass entry is refused.
          import ipaddress, re, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          HOSTNAME = re.compile(
              r"[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?"
              r"(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+"
          )

          def fail(msg):
              raise SystemExit(f"::error::service data rejected: {msg}")

          def lines(path, limit):
              data = path.read_bytes()
              if not 0 < len(data) <= limit:
                  fail(f"{path.name} size {len(data)} outside 1..{limit}")
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  fail(f"{path.name} is not UTF-8")
              for number, raw in enumerate(text.splitlines(), 1):
                  line = raw.strip()
                  if line and not line.startswith("#"):
                      yield number, line

          entries = 0
          for number, line in lines(root / "hosts", 256 * 1024):
              parts = line.split()
              if len(parts) != 2:
                  fail(f"hosts:{number} expected 'IP hostname', got {line!r}")
              addr, host = parts
              try:
                  ip = ipaddress.ip_address(addr)
              except ValueError:
                  fail(f"hosts:{number} invalid address {addr!r}")
              # Public unicast only: a redirect to loopback/LAN/0.0.0.0 is either
              # a blackhole or a hijack toward the user's own network.
              if not ip.is_global:
                  fail(f"hosts:{number} non-public target {addr}")
              if len(host) > 253 or not HOSTNAME.fullmatch(host):
                  fail(f"hosts:{number} invalid hostname {host!r}")
              entries += 1
          if not 1 <= entries <= 2000:
              fail(f"hosts has {entries} entries")
          print(f"hosts OK: {entries} entries")

          nets = 0
          for number, line in lines(root / "ipset-service.txt", 8 * 1024 * 1024):
              try:
                  net = ipaddress.ip_network(line, strict=False)
              except ValueError:
                  fail(f"ipset-service:{number} invalid CIDR {line!r}")
              # A near-zero prefix would drag the whole internet into the service
              # profile instead of the blocked services.
              if net.prefixlen < (8 if net.version == 4 else 16):
                  fail(f"ipset-service:{number} prefix too broad: {line}")
              nets += 1
          if not 1 <= nets <= 300000:
              fail(f"ipset-service has {nets} entries")
          print(f"ipset-service OK: {nets} networks")
          PY

      - name: Assemble the channel bundle (data only)
        env:
          UPSTREAM_TAG: ${{ steps.fl.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p bundle/lists bundle/bin bundle/service
          python3 src-tauri/dpi/gen_strategies.py "$FL_DIR" bundle/strategies.json
          test -s bundle/strategies.json
          test -d "$FL_DIR/lists" || { echo "::error::lists directory missing"; exit 1; }
          test -d "$FL_DIR/bin" || { echo "::error::bin directory missing"; exit 1; }
          # base lists only (user lists live on the client, we don't ship them)
          for f in list-general.txt list-google.txt list-exclude.txt ipset-exclude.txt; do
            [ -f "$FL_DIR/lists/$f" ] || { echo "::error::missing lists/$f"; exit 1; }
            cp "$FL_DIR/lists/$f" "bundle/lists/$f"
          done
          # strategy .bin payloads (inert data, version-coupled with strategies.json)
          find "$FL_DIR/bin" -maxdepth 1 -type f -name '*.bin' -print -quit | grep -q . || { echo "::error::no .bin payloads found"; exit 1; }
          python3 - "$FL_DIR/bin" <<'PY'
          from pathlib import Path
          import re, sys

          files = list(Path(sys.argv[1]).glob("*.bin"))
          if not 1 <= len(files) <= 256:
              raise SystemExit(f"invalid .bin count: {len(files)}")
          for path in files:
              if not re.fullmatch(r"[A-Za-z0-9._-]+\.bin", path.name):
                  raise SystemExit(f"unsafe .bin name: {path.name!r}")
              size = path.stat().st_size
              if not 1 <= size <= 1024 * 1024:
                  raise SystemExit(f"unsafe .bin size: {path.name} ({size})")
          PY
          cp "$FL_DIR"/bin/*.bin bundle/bin/
          # Service files are taken only from the reviewed release/source archive;
          # never fetch unsigned raw files during channel assembly or runtime.
          for f in hosts ipset-service.txt; do
            [ -f "$FL_DIR/.service/$f" ] || { echo "::error::missing .service/$f (provide exact-version service_archive_sha256)"; exit 1; }
            cp "$FL_DIR/.service/$f" "bundle/service/$f"
          done
          echo "$UPSTREAM_TAG" > bundle/version.txt
          python3 - <<'PY'
          import json, os, sys
          expected = os.environ['UPSTREAM_TAG']
          value = open('bundle/version.txt', encoding='utf-8').read().strip()
          if value != expected:
              raise SystemExit(f'version mismatch: {value!r} != {expected!r}')
          data = json.load(open('bundle/strategies.json', encoding='utf-8'))
          if not isinstance(data, list) or not data:
              raise SystemExit('strategies.json is empty')
          print(f'strategies OK: {len(data)}')
          PY

      - name: Guard — all referenced .bin present
        run: |
          python3 - <<'PY'
          import json, re, os, sys
          strat = json.load(open("bundle/strategies.json"))
          have = set(os.listdir("bundle/bin"))
          need = set()
          for st in strat:
              for a in st["args"]:
                  m = re.search(r"%BIN%([^\s]+\.bin)", a)
                  if m: need.add(m.group(1))
          missing = sorted(need - have)
          if missing:
              print("::error::strategies reference missing .bin files: " + ", ".join(missing))
              sys.exit(1)
          print(f"bin OK: {len(have)} payloads in the bundle, {len(need)} used by strategies")
          PY

      - name: Pack + checksum
        id: pack
        run: |
          set -euo pipefail
          # Deterministic ZIP: generated files and Git-blob downloads otherwise
          # receive the current mtime, causing a false "changed" result every day.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          root = Path("bundle")
          with ZipFile("dpi-channel.zip", "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  rel = path.relative_to(root).as_posix()
                  info = ZipInfo(rel, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, path.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=9)
          PY
          sha=$(sha256sum dpi-channel.zip | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "bundle sha256=$sha"

      - name: Install signature verifier
        run: |
          set -euo pipefail
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends minisign
          fi

      - name: Skip only if the published channel is complete
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_SHA256: ${{ steps.pack.outputs.sha }}
          UPSTREAM_TAG: ${{ steps.fl.outputs.tag }}
        run: |
          set -euo pipefail
          changed=true
          mkdir -p previous
          if gh release view dpi-channel --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release download dpi-channel --repo "$GITHUB_REPOSITORY" \
              --pattern dpi-channel.zip \
              --pattern dpi-channel.zip.sig \
              --pattern version.txt \
              --dir previous >/dev/null 2>&1; then
            previous_sha=$(sha256sum previous/dpi-channel.zip | awk '{print $1}')
            printf '%s\n' "$UPSTREAM_TAG" > previous/expected-version.txt
            signature_ok=false
            if [ "$previous_sha" = "$BUNDLE_SHA256" ] \
              && cmp -s previous/version.txt previous/expected-version.txt \
              && base64 --decode previous/dpi-channel.zip.sig > previous/dpi-channel.minisig 2>/dev/null; then
              python3 - <<'PY'
          import base64
          from pathlib import Path
          import re

          source = Path("src-tauri/src/dpi.rs").read_text(encoding="utf-8")
          # Legacy-константа исчезает на последнем шаге ротации ключа
          # (docs/DPI_CHANNEL_KEY_ROTATION.md, шаг 5) — это штатное конечное
          # состояние, а не поломка. Обязателен только dedicated key.
          written = 0
          for index, name in enumerate(("CHANNEL_DEDICATED_PUBKEY_B64", "CHANNEL_LEGACY_PUBKEY_B64")):
              match = re.search(rf'const {name}: &str = "([^"]+)";', source)
              if not match:
                  if name == "CHANNEL_DEDICATED_PUBKEY_B64":
                      raise SystemExit(f"missing {name}")
                  continue
              Path(f"previous/channel-{index}.pub").write_bytes(
                  base64.b64decode(match.group(1), validate=True)
              )
              written += 1
          if written == 0:
              raise SystemExit("no DPI channel public keys found")
          PY
              for key in previous/channel-*.pub; do
                if minisign -Vm previous/dpi-channel.zip \
                  -x previous/dpi-channel.minisig -p "$key" >/dev/null 2>&1; then
                  signature_ok=true
                  break
                fi
              done
            fi
            if [ "$previous_sha" = "$BUNDLE_SHA256" ] \
              && cmp -s previous/version.txt previous/expected-version.txt \
              && [ "$signature_ok" = true ]; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = false ]; then
            echo "channel ZIP, signature and version are complete and current — exiting"
          else
            echo "channel is new, incomplete or inconsistent — publishing all assets"
          fi

      - name: Install locked signer
        if: steps.chk.outputs.changed == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sign the bundle (dedicated DPI key)
        if: steps.chk.outputs.changed == 'true'
        env:
          DPI_CHANNEL_SIGNING_PRIVATE_KEY: ${{ secrets.DPI_CHANNEL_SIGNING_PRIVATE_KEY }}
          DPI_CHANNEL_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DPI_CHANNEL_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # → dpi-channel.zip.sig (base64 minisign signature; Rust decodes and verifies it)
          npx --no-install tauri signer sign --private-key "$DPI_CHANNEL_SIGNING_PRIVATE_KEY" --password "$DPI_CHANNEL_SIGNING_PRIVATE_KEY_PASSWORD" dpi-channel.zip
          test -f dpi-channel.zip.sig

      - name: Publish to the dpi-channel release
        if: steps.chk.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.fl.outputs.tag }}
          UPSTREAM_SOURCE: ${{ steps.fl.outputs.source }}
          UPSTREAM_COMMIT: ${{ steps.fl.outputs.sha }}
          UPSTREAM_SHA256: ${{ steps.fl.outputs.expected }}
          SERVICE_MODE: ${{ steps.fl.outputs.service_mode }}
          SERVICE_SHA256: ${{ steps.fl.outputs.service_sha }}
          BUNDLE_SHA256: ${{ steps.pack.outputs.sha }}
        run: |
          set -euo pipefail
          notes="flowseal=$UPSTREAM_TAG source=$UPSTREAM_SOURCE upstream_commit=${UPSTREAM_COMMIT:-none} upstream_sha256=$UPSTREAM_SHA256 service_mode=$SERVICE_MODE service_upstream_sha256=${SERVICE_SHA256:-release-commit} sha256=$BUNDLE_SHA256"
          if gh release view dpi-channel >/dev/null 2>&1; then
            gh release edit dpi-channel --prerelease --notes "$notes"
          else
            gh release create dpi-channel --prerelease --title "DPI channel (strategy data)" --notes "$notes"
          fi
          # version.txt as a separate asset: dpi_check_update reads it directly
          # (cheap, no full bundle download) and compares with the local version.
          # Check source = install source (this same channel) → no "broken loop".
          cp bundle/version.txt version.txt
          gh release upload dpi-channel dpi-channel.zip dpi-channel.zip.sig version.txt --clobber
          echo "channel published: flowseal=$UPSTREAM_TAG"
