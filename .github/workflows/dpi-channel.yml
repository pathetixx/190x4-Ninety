name: DPI channel (Flowseal sync)

# Data-channel robot: once a day it checks the latest Flowseal release, rebuilds
# strategies.json (gen_strategies.py), collects the lists and .bin payloads,
# signs the bundle with our minisign key (the same TAURI_SIGNING_PRIVATE_KEY as
# OTA) and publishes it to the `dpi-channel` prerelease. Ninety pulls this
# bundle on the fly, verifies the signature and applies it — WITHOUT an app
# update. This is DATA ONLY (strategies/lists/.bin + service/hosts + service/
# ipset-service.txt, consumed by dpi_hosts_apply/dpi_update_ipset — those write
# to the system hosts file, so they must come signed, not from raw github). The
# engine (winws.exe/WinDivert) is NOT touched here — it ships via the signed OTA
# release (see engine-watch.yml: watches bol-van/zapret-win-bundle, opens a PR).
#
# prerelease=true matters: dpi-channel must NOT become "Latest", otherwise it
# would shadow the app updater endpoint (releases/latest/download/latest.json).

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpi-channel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Latest Flowseal release
        id: fl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api repos/Flowseal/zapret-discord-youtube/releases/latest --jq .tag_name)
          [ -n "$tag" ] || { echo "::error::failed to resolve the Flowseal tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Flowseal latest = $tag"

      - name: Download and unpack the release
        run: |
          set -euo pipefail
          tag="${{ steps.fl.outputs.tag }}"
          url="https://github.com/Flowseal/zapret-discord-youtube/releases/download/${tag}/zapret-discord-youtube-${tag}.zip"
          curl -fsSL -o fl.zip "$url"
          mkdir -p fl && unzip -q fl.zip -d fl
          # .bat files live in the zip root; normalize to the dir with general*.bat
          d=$(dirname "$(find fl -iname 'general.bat' | head -1)")
          echo "FL_DIR=$d" >> "$GITHUB_ENV"

      - name: Assemble the channel bundle (data only)
        run: |
          set -euo pipefail
          mkdir -p bundle/lists bundle/bin bundle/service
          python3 src-tauri/dpi/gen_strategies.py "$FL_DIR" bundle/strategies.json
          # base lists only (user lists live on the client, we don't ship them)
          for f in list-general.txt list-google.txt list-exclude.txt ipset-exclude.txt; do
            [ -f "$FL_DIR/lists/$f" ] && cp "$FL_DIR/lists/$f" "bundle/lists/$f" || true
          done
          # strategy .bin payloads (inert data, version-coupled with strategies.json)
          cp "$FL_DIR"/bin/*.bin bundle/bin/ 2>/dev/null || true
          # signed service data: hosts pin + ipset base (pulled by dpi_hosts_apply /
          # dpi_update_ipset). Goes into the signed zip so the DNS-pin path is verified.
          for f in hosts ipset-service.txt; do
            [ -f "$FL_DIR/.service/$f" ] && cp "$FL_DIR/.service/$f" "bundle/service/$f" || true
          done
          echo "${{ steps.fl.outputs.tag }}" > bundle/version.txt

      - name: Guard — all referenced .bin present
        run: |
          python3 - <<'PY'
          import json, re, os, sys
          strat = json.load(open("bundle/strategies.json"))
          have = set(os.listdir("bundle/bin"))
          need = set()
          for st in strat:
              for a in st["args"]:
                  m = re.search(r"%BIN%([^\s]+\.bin)", a)
                  if m: need.add(m.group(1))
          missing = sorted(need - have)
          if missing:
              print("::error::strategies reference missing .bin files: " + ", ".join(missing))
              sys.exit(1)
          print(f"bin OK: {len(have)} payloads in the bundle, {len(need)} used by strategies")
          PY

      - name: Pack + checksum
        id: pack
        run: |
          set -euo pipefail
          (cd bundle && zip -qr ../dpi-channel.zip .)
          sha=$(sha256sum dpi-channel.zip | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "bundle sha256=$sha"

      - name: Skip if unchanged
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(gh release view dpi-channel --json body --jq .body 2>/dev/null | grep -oP 'sha256=\K\S+' || echo "")
          if [ "$prev" = "${{ steps.pack.outputs.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "channel is up to date — exiting"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tauri signer
        if: steps.chk.outputs.changed == 'true'
        run: npm install -g @tauri-apps/cli@^2

      - name: Sign the bundle (minisign, our OTA key)
        if: steps.chk.outputs.changed == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          # → dpi-channel.zip.sig (base64 minisign signature; Rust decodes and verifies it)
          tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "" dpi-channel.zip
          test -f dpi-channel.zip.sig

      - name: Publish to the dpi-channel release
        if: steps.chk.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="flowseal=${{ steps.fl.outputs.tag }} sha256=${{ steps.pack.outputs.sha }}"
          if gh release view dpi-channel >/dev/null 2>&1; then
            gh release edit dpi-channel --prerelease --notes "$notes"
          else
            gh release create dpi-channel --prerelease --title "DPI channel (strategy data)" --notes "$notes"
          fi
          # version.txt as a separate asset: dpi_check_update reads it directly
          # (cheap, no full bundle download) and compares with the local version.
          # Check source = install source (this same channel) → no "broken loop".
          cp bundle/version.txt version.txt
          gh release upload dpi-channel dpi-channel.zip dpi-channel.zip.sig version.txt --clobber
          echo "channel published: flowseal=${{ steps.fl.outputs.tag }}"
