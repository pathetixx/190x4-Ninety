name: DPI channel (Flowseal sync)

# Reviewed data-channel publisher: an operator supplies the exact upstream tag,
# source preference, and reviewed archive SHA-256, then the workflow rebuilds
# from immutable GitHub or versioned SourceForge fallback artifacts.
# strategies.json (gen_strategies.py), collects the lists and .bin payloads,
# signs the bundle after explicit tag+checksum review and publishes it to the
# `dpi-channel` prerelease. Ninety pulls this
# bundle on the fly, verifies the signature and applies it — WITHOUT an app
# update. This is DATA ONLY (strategies/lists/.bin + service/hosts + service/
# ipset-service.txt, consumed by dpi_hosts_apply/dpi_update_ipset — those write
# to the system hosts file, so they must come signed, not from raw github). The
# engine (winws.exe/WinDivert) is NOT touched here — it ships via the signed OTA
# release (see engine-watch.yml: watches bol-van/zapret-win-bundle, opens a PR).
#
# prerelease=true matters: dpi-channel must NOT become "Latest", otherwise it
# would shadow the app updater endpoint (releases/latest/download/latest.json).

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Exact reviewed Flowseal release tag"
        required: true
        type: string
      upstream_source:
        description: "Upstream source (auto tries GitHub, then SourceForge)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - github
          - sourceforge
      archive_sha256:
        description: "Reviewed SHA-256 of the upstream release archive"
        required: true
        type: string
      service_archive_sha256:
        description: "SHA-256 of exact-version source archive when release ZIP lacks .service"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dpi-channel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve immutable Flowseal source
        id: fl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_SOURCE: ${{ inputs.upstream_source }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          requested="$REQUESTED_SOURCE"
          expected="$ARCHIVE_SHA256"
          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid upstream tag"; exit 1; }
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::archive_sha256 must be 64 hex chars"; exit 1; }
          [[ "$requested" = auto || "$requested" = github || "$requested" = sourceforge ]] || { echo "::error::invalid upstream_source"; exit 1; }

          source=""
          sha=""
          archive_url=""
          github_ok=false
          if [ "$requested" != sourceforge ]; then
            if obj=$(gh api "repos/Flowseal/zapret-discord-youtube/git/ref/tags/$tag" 2>/dev/null); then
              type=$(jq -r .object.type <<<"$obj")
              sha=$(jq -r .object.sha <<<"$obj")
              if [ "$type" = tag ]; then
                sha=$(gh api "repos/Flowseal/zapret-discord-youtube/git/tags/$sha" --jq .object.sha)
              fi
              if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                archive_url="https://github.com/Flowseal/zapret-discord-youtube/releases/download/${tag}/zapret-discord-youtube-${tag}.zip"
                if curl -fsIL --max-time 20 "$archive_url" >/dev/null 2>&1; then github_ok=true; fi
              fi
            fi
          fi
          if [ "$github_ok" = true ]; then
            source=github
          elif [ "$requested" = github ]; then
            echo "::error::requested GitHub source is unavailable"; exit 1
          else
            source=sourceforge
            sha=""
            archive_url="https://sourceforge.net/projects/flowseal.mirror/files/${tag}/zapret-discord-youtube-${tag}.zip/download"
            curl -fsIL --max-time 20 "$archive_url" >/dev/null 2>&1 || { echo "::error::SourceForge archive is unavailable"; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "archive_url=$archive_url" >> "$GITHUB_OUTPUT"
          echo "service_sha=${{ inputs.service_archive_sha256 }}" >> "$GITHUB_OUTPUT"
          echo "Flowseal reviewed source = $source tag=$tag commit=${sha:-none} archive_sha256=$expected"

      - name: Download and unpack the release
        run: |
          set -euo pipefail
          url="${{ steps.fl.outputs.archive_url }}"
          curl -fsSL --max-time 120 -o fl.zip "$url"
          echo "${{ steps.fl.outputs.expected }}  fl.zip" | sha256sum --check --strict
          python3 - fl.zip <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          limit = 200 * 1024 * 1024
          with zipfile.ZipFile(path) as z:
              total = 0
              for info in z.infolist():
                  name = info.filename.replace('\\', '/')
                  if name.startswith('/') or name.startswith('../') or '/../' in name or name == '..':
                      raise SystemExit(f'path traversal in archive: {info.filename}')
                  total += info.file_size
                  if total > limit:
                      raise SystemExit('archive uncompressed size exceeds 200 MiB')
          PY
          mkdir -p fl && unzip -q fl.zip -d fl
          # .bat files live in the zip root; normalize to the dir with general*.bat
          d=$(dirname "$(find fl -type f -iname 'general.bat' | head -1)")
          [ -n "$d" ] && [ "$d" != "." ] || { echo "::error::general.bat not found"; exit 1; }
          echo "FL_DIR=$d" >> "$GITHUB_ENV"
          echo "source=${{ steps.fl.outputs.source }}" >> "$GITHUB_ENV"

      - name: Download exact-version service archive when needed
        if: ${{ steps.fl.outputs.source == 'sourceforge' || inputs.service_archive_sha256 != '' }}
        run: |
          set -euo pipefail
          service_sha='${{ inputs.service_archive_sha256 }}'
          if [ -z "$service_sha" ]; then
            echo "::error::release ZIP lacks guaranteed .service; service_archive_sha256 is required"; exit 1
          fi
          [[ "$service_sha" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::invalid service_archive_sha256"; exit 1; }
          if [ "${{ steps.fl.outputs.source }}" = sourceforge ]; then
            service_url="https://sourceforge.net/projects/flowseal.mirror/files/${{ steps.fl.outputs.tag }}/${{ steps.fl.outputs.tag }}%20source%20code.zip/download"
          else
            service_url="https://github.com/Flowseal/zapret-discord-youtube/archive/${{ steps.fl.outputs.sha }}.zip"
          fi
          curl -fsSL --max-time 120 -o service.zip "$service_url"
          echo "$service_sha  service.zip" | sha256sum --check --strict
          python3 - service.zip <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              total = 0
              for info in z.infolist():
                  name = info.filename.replace('\\', '/')
                  if name.startswith('/') or name.startswith('../') or '/../' in name or name == '..':
                      raise SystemExit(f'path traversal in service archive: {info.filename}')
                  total += info.file_size
                  if total > 200 * 1024 * 1024:
                      raise SystemExit('service archive uncompressed size exceeds 200 MiB')
          PY
          mkdir -p service-src && unzip -q service.zip -d service-src
          service_root=$(find service-src -type d -name .service -print -quit)
          [ -n "$service_root" ] || { echo "::error::.service directory missing from exact-version source archive"; exit 1; }
          mkdir -p fl/.service
          cp "$service_root/hosts" fl/.service/hosts
          cp "$service_root/ipset-service.txt" fl/.service/ipset-service.txt

      - name: Assemble the channel bundle (data only)
        run: |
          set -euo pipefail
          mkdir -p bundle/lists bundle/bin bundle/service
          python3 src-tauri/dpi/gen_strategies.py "$FL_DIR" bundle/strategies.json
          test -s bundle/strategies.json
          test -d "$FL_DIR/lists" || { echo "::error::lists directory missing"; exit 1; }
          test -d "$FL_DIR/bin" || { echo "::error::bin directory missing"; exit 1; }
          # base lists only (user lists live on the client, we don't ship them)
          for f in list-general.txt list-google.txt list-exclude.txt ipset-exclude.txt; do
            [ -f "$FL_DIR/lists/$f" ] || { echo "::error::missing lists/$f"; exit 1; }
            cp "$FL_DIR/lists/$f" "bundle/lists/$f"
          done
          # strategy .bin payloads (inert data, version-coupled with strategies.json)
          find "$FL_DIR/bin" -maxdepth 1 -type f -name '*.bin' -print -quit | grep -q . || { echo "::error::no .bin payloads found"; exit 1; }
          cp "$FL_DIR"/bin/*.bin bundle/bin/
          # Service files are taken only from the reviewed release/source archive;
          # never fetch unsigned raw files during channel assembly or runtime.
          for f in hosts ipset-service.txt; do
            [ -f "$FL_DIR/.service/$f" ] || { echo "::error::missing .service/$f (provide exact-version service_archive_sha256)"; exit 1; }
            cp "$FL_DIR/.service/$f" "bundle/service/$f"
          done
          echo "${{ steps.fl.outputs.tag }}" > bundle/version.txt
          python3 - <<'PY'
          import json, os, sys
          expected = os.environ.get('EXPECTED_TAG', '${{ steps.fl.outputs.tag }}')
          value = open('bundle/version.txt', encoding='utf-8').read().strip()
          if value != expected:
              raise SystemExit(f'version mismatch: {value!r} != {expected!r}')
          data = json.load(open('bundle/strategies.json', encoding='utf-8'))
          if not isinstance(data, list) or not data:
              raise SystemExit('strategies.json is empty')
          print(f'strategies OK: {len(data)}')
          PY

      - name: Guard — all referenced .bin present
        run: |
          python3 - <<'PY'
          import json, re, os, sys
          strat = json.load(open("bundle/strategies.json"))
          have = set(os.listdir("bundle/bin"))
          need = set()
          for st in strat:
              for a in st["args"]:
                  m = re.search(r"%BIN%([^\s]+\.bin)", a)
                  if m: need.add(m.group(1))
          missing = sorted(need - have)
          if missing:
              print("::error::strategies reference missing .bin files: " + ", ".join(missing))
              sys.exit(1)
          print(f"bin OK: {len(have)} payloads in the bundle, {len(need)} used by strategies")
          PY

      - name: Pack + checksum
        id: pack
        run: |
          set -euo pipefail
          (cd bundle && zip -qr ../dpi-channel.zip .)
          sha=$(sha256sum dpi-channel.zip | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "bundle sha256=$sha"

      - name: Skip if unchanged
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(gh release view dpi-channel --json body --jq .body 2>/dev/null | grep -oP 'sha256=\K\S+' || echo "")
          if [ "$prev" = "${{ steps.pack.outputs.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "channel is up to date — exiting"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install locked signer
        if: steps.chk.outputs.changed == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sign the bundle (dedicated DPI key)
        if: steps.chk.outputs.changed == 'true'
        env:
          DPI_CHANNEL_SIGNING_PRIVATE_KEY: ${{ secrets.DPI_CHANNEL_SIGNING_PRIVATE_KEY }}
          DPI_CHANNEL_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DPI_CHANNEL_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # → dpi-channel.zip.sig (base64 minisign signature; Rust decodes and verifies it)
          npx --no-install tauri signer sign --private-key "$DPI_CHANNEL_SIGNING_PRIVATE_KEY" --password "$DPI_CHANNEL_SIGNING_PRIVATE_KEY_PASSWORD" dpi-channel.zip
          test -f dpi-channel.zip.sig

      - name: Publish to the dpi-channel release
        if: steps.chk.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="flowseal=${{ steps.fl.outputs.tag }} source=${{ steps.fl.outputs.source }} upstream_commit=${{ steps.fl.outputs.sha || 'none' }} upstream_sha256=${{ steps.fl.outputs.expected }} service_upstream_sha256=${{ steps.fl.outputs.service_sha || 'none' }} sha256=${{ steps.pack.outputs.sha }}"
          if gh release view dpi-channel >/dev/null 2>&1; then
            gh release edit dpi-channel --prerelease --notes "$notes"
          else
            gh release create dpi-channel --prerelease --title "DPI channel (strategy data)" --notes "$notes"
          fi
          # version.txt as a separate asset: dpi_check_update reads it directly
          # (cheap, no full bundle download) and compares with the local version.
          # Check source = install source (this same channel) → no "broken loop".
          cp bundle/version.txt version.txt
          gh release upload dpi-channel dpi-channel.zip dpi-channel.zip.sig version.txt --clobber
          echo "channel published: flowseal=${{ steps.fl.outputs.tag }}"
