name: Checks

# Fast validation without building the installer: JS tests (parsers/builder/
# deep-link/i18n sync) + cargo test on windows (Rust helpers and compilation of
# all cfg(windows) modules). The release build.yml still runs only on tags.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.sha }}
  cancel-in-progress: false

jobs:
  installer-preview:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Compile exact Kurogane shell
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          & $makensis /V3 src-tauri/windows/kurogane/smoke.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture and exercise real Windows UI
        shell: pwsh
        run: ./scripts/capture-installer-preview.ps1 -Installer ./src-tauri/windows/kurogane/kurogane-smoke.exe -OutputDirectory ./installer-preview

      - name: Upload full-window screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-preview-${{ github.sha }}
          path: installer-preview/*.png
          if-no-files-found: error
          retention-days: 14

  js-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # node --test glob args require Node 21+
          node-version: 22

      - name: Run JS tests
        run: npm test && npm run check:versions && npm run check:actions-pinned && npm run check:dpi-key-rotation

      - name: Test release scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  js-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # package-lock.json закоммичен → детерминированная установка через npm ci.
      - name: Install deps
        run: npm ci --no-audit --no-fund

      # eslint.config.js + --max-warnings 0 (в npm-скрипте): и ошибки (no-undef,
      # дубли ключей, недостижимый код), и warn-находки (unused-vars) валят гейт.
      - name: Run ESLint
        run: npm run lint

  rust-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Stub sidecar binaries and wintun (needed by tauri-build, not the tests)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          foreach ($n in @("sing-box", "xray", "naive", "trusttunnel_client")) {
            Set-Content -Path "src-tauri/binaries/$n-x86_64-pc-windows-msvc.exe" -Value "stub"
          }
          Set-Content -Path "src-tauri/binaries/wintun.dll" -Value "stub"

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo fmt (gating)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo clippy (gating)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
