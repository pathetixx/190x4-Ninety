name: Checks

# Fast validation without building the installer: JS tests (parsers/builder/
# deep-link/i18n sync) + cargo test on windows (Rust helpers and compilation of
# all cfg(windows) modules). The release build.yml still runs only on tags.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.sha }}
  cancel-in-progress: false

jobs:
  js-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Node preflight
        run: npm run preflight

      - name: Install deps without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run JS tests
        run: npm test && npm run test:coverage && npm run check:versions && npm run check:actions-pinned && npm run check:dpi-key-rotation

      - name: Upload JS coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Test release scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  js-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Node preflight
        run: npm run preflight

      # package-lock.json закоммичен → детерминированная установка через npm ci.
      - name: Install deps
        run: npm ci --no-audit --no-fund

      # eslint.config.js + --max-warnings 0 (в npm-скрипте): и ошибки (no-undef,
      # дубли ключей, недостижимый код), и warn-находки (unused-vars) валят гейт.
      - name: Run ESLint
        run: npm run lint

  rust-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Stub sidecar binaries and wintun (needed by tauri-build, not the tests)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          foreach ($n in @("sing-box", "xray", "naive", "trusttunnel_client")) {
            Set-Content -Path "src-tauri/binaries/$n-x86_64-pc-windows-msvc.exe" -Value "stub"
          }
          Set-Content -Path "src-tauri/binaries/wintun.dll" -Value "stub"

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo fmt (gating)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo clippy (gating)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
