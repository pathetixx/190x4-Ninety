name: Checks

# Fast validation without building the installer: JS tests (parsers/builder/
# deep-link/i18n sync) + cargo test on windows (Rust helpers and compilation of
# all cfg(windows) modules). The release build.yml still runs only on tags.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.sha }}
  cancel-in-progress: false

jobs:
  js-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # node --test glob args require Node 21+
          node-version: 22

      - name: Run JS tests
        run: npm test

  rust-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stub sidecar binaries and wintun (needed by tauri-build, not the tests)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          foreach ($n in @("sing-box", "xray", "naive", "trusttunnel_client")) {
            Set-Content -Path "src-tauri/binaries/$n-x86_64-pc-windows-msvc.exe" -Value "stub"
          }
          Set-Content -Path "src-tauri/binaries/wintun.dll" -Value "stub"

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy (gating)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
