name: Commit reviewed README screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/commit-readme-screenshots.yml"

permissions:
  actions: read
  contents: write

jobs:
  commit-reviewed-artifact:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/refresh-readme-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download and verify reviewed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: "8410112891"
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output artifact.zip
          unzip -t artifact.zip
          mkdir artifact screenshots
          unzip -q artifact.zip -d artifact
          unzip -t artifact/readme-screenshots.zip
          unzip -q artifact/readme-screenshots.zip -d screenshots
          for name in home nodes profiles dpi settings logs quality; do
            test -s "screenshots/${name}.png"
            file "screenshots/${name}.png" | grep -q 'PNG image data, 1010 x 663'
            cp "screenshots/${name}.png" "docs/${name}.png"
          done

      - name: Commit screenshots and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/commit-readme-screenshots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/home.png \
            docs/nodes.png \
            docs/profiles.png \
            docs/dpi.png \
            docs/settings.png \
            docs/logs.png \
            docs/quality.png \
            .github/workflows/commit-readme-screenshots.yml
          git diff --cached --stat
          git commit -m "docs: refresh README screenshots"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
