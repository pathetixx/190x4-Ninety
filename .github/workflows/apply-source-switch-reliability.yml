name: Apply source-switch reliability patch

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-source-switch-reliability
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/source-switch-reliability'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy

      - name: Apply reviewed patch
        run: python scripts/apply_source_switch_reliability.py

      - name: Remove superseded log severity helper
        shell: pwsh
        run: |
          $path = 'src/lib/logs-view.js'
          $content = [System.IO.File]::ReadAllText($path)
          $pattern = '(?ms)^function levelGrade\(lvl\) \{\r?\n.*?^\}\r?\n\r?\n'
          $matches = [regex]::Matches($content, $pattern)
          if ($matches.Count -ne 1) {
            Write-Error "Expected one legacy levelGrade helper, found $($matches.Count)"
            exit 1
          }
          $content = [regex]::Replace($content, $pattern, '', 1)
          [System.IO.File]::WriteAllText(
            $path,
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Remove one-shot patch infrastructure
        shell: pwsh
        run: |
          Remove-Item scripts/apply_source_switch_reliability.py
          Remove-Item .source-switch-reliability-trigger
          Remove-Item .github/workflows/apply-source-switch-reliability.yml

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend preflight
        run: npm run preflight

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Prepare sidecar placeholders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          foreach ($name in @(
            'sing-box-x86_64-pc-windows-msvc.exe',
            'xray-x86_64-pc-windows-msvc.exe',
            'naive-x86_64-pc-windows-msvc.exe',
            'trusttunnel_client-x86_64-pc-windows-msvc.exe',
            'wintun.dll'
          )) {
            New-Item -ItemType File -Force -Path "src-tauri/binaries/$name" | Out-Null
          }

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Diff hygiene
        shell: pwsh
        run: |
          git diff --check
          $status = @(git status --porcelain)
          if ($status.Count -eq 0) {
            Write-Error 'Patch produced no changes'
            exit 1
          }
          $status | ForEach-Object { Write-Host $_ }

      - name: Commit tested patch to source branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize active source switching'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
