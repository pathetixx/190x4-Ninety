import assert from "node:assert/strict";
import { waitForMatchingSourceTopology } from "../src/lib/source-switch-readiness.js";

test("source topology waits for the complete target selector instead of failing first snapshot", async () => {
  let reads = 0;
  const result = await waitForMatchingSourceTopology({
    read: async () => ({ ready: ++reads >= 3 }),
    matches: value => value.ready,
    wait: async () => {},
  });
  assert.equal(result.status, "ready");
  assert.equal(result.attempts, 3);
  assert.equal(reads, 3);
});

test("source topology stops immediately when the operation becomes stale", async () => {
  let current = true;
  let reads = 0;
  const result = await waitForMatchingSourceTopology({
    read: async () => {
      reads++;
      current = false;
      return { ready: false };
    },
    matches: value => value.ready,
    isCurrent: () => current,
    wait: async () => {},
  });
  assert.equal(result.status, "stale");
  assert.equal(reads, 1);
});

test("source topology returns a bounded unavailable verdict", async () => {
  let reads = 0;
  const result = await waitForMatchingSourceTopology({
    read: async () => { reads++; return { ready: false }; },
    matches: value => value.ready,
    attempts: 4,
    wait: async () => {},
  });
  assert.equal(result.status, "unavailable");
  assert.equal(result.reason, "topology_mismatch");
  assert.equal(reads, 4);
});
''')

          # 2. Migrate legacy per-source selections. A subscription which once
          # had one node can retain the singleton sentinel "proxy"; after it
          # grows to multiple nodes the selector contains auto/lowest/node tags,
          # so treating "proxy" as a missing manual node causes an immediate
          # post-start shutdown and rollback.
          replace_once('src/lib/proxy-selection.js',
