      - name: Diff hygiene
        shell: pwsh
        run: |
          git diff --check
          git status --short
          if (-not (git diff --quiet)) { exit 0 }
          Write-Error 'Patch produced no changes'
          exit 1

      - name: Commit directly to main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src src-tauri tests .github/workflows/apply-source-switch-reliability.yml
          git commit -m 'fix: stabilize active source switching'
          git push origin HEAD:main
