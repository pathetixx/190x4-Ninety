name: Apply source-switch reliability patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-source-switch-reliability.yml

permissions:
  contents: write

concurrency:
  group: apply-source-switch-reliability
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: github.event.head_commit.message == 'chore: stage source-switch reliability patch'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply reviewed patch
        shell: pwsh
        run: |
          $patch = @'
          from pathlib import Path

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, content):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8', newline='\n')

          def replace_once(path, old, new):
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one replacement, found {count}: {old[:120]!r}')
              write(path, content.replace(old, new, 1))

          # 1. Bounded readiness helper: Clash API may answer before every
          # selector/outbound is visible. SourceSwitch must not destroy a live
          # target generation because of one transient /proxies snapshot.
          write('src/lib/source-switch-readiness.js', r'''const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

export async function waitForMatchingSourceTopology({
  read,
  matches,
  isCurrent = () => true,
  attempts = 6,
  retryDelayMs = 120,
  wait = sleep,
} = {}) {
  if (typeof read !== "function" || typeof matches !== "function") {
    throw new TypeError("source topology readiness requires read and matches");
  }
  const maxAttempts = Math.max(1, Number(attempts) || 1);
  let lastTopology = null;
  let lastError = null;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    if (!isCurrent()) return { status: "stale", topology: lastTopology };
    try {
      lastTopology = await read();
      if (!isCurrent()) return { status: "stale", topology: lastTopology };
      if (matches(lastTopology)) {
        return { status: "ready", topology: lastTopology, attempts: attempt + 1 };
      }
    } catch (error) {
      lastError = error;
    }
    if (attempt + 1 < maxAttempts) {
      await wait(retryDelayMs * (attempt + 1));
    }
  }
  return {
    status: "unavailable",
    topology: lastTopology,
    attempts: maxAttempts,
    reason: lastError ? "clash_api_error" : "topology_mismatch",
  };
}
''')

