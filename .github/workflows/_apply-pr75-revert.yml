name: Apply PR 75 revert

on:
  push:
    branches:
      - revert/pr75-dataplane-watchdog

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revert/pr75-dataplane-watchdog

      - name: Revert PR 75 merge commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/_apply-pr75-revert.yml
          git add -A

          set +e
          git revert --no-commit -m 1 3513add89f62cafc9d43031dcad5cd5438e073f1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "PR 75 revert has conflicts:"
            git status --short
            git diff --name-only --diff-filter=U
            exit "$status"
          fi

          git add -A
          git commit -m "revert: remove aggressive dataplane watchdog"
          git push origin HEAD:revert/pr75-dataplane-watchdog
