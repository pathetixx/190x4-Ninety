name: Apply PR 75 revert

on:
  push:
    branches:
      - revert/pr75-dataplane-watchdog
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  revert:
    if: github.event_name == 'push' || github.head_ref == 'revert/pr75-dataplane-watchdog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revert/pr75-dataplane-watchdog

      - name: Revert PR 75 and preserve later non-conflicting work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git revert --no-commit -m 1 3513add89f62cafc9d43031dcad5cd5438e073f1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            while IFS= read -r file; do
              if [ "$file" = "src-tauri/src/health.rs" ]; then
                git rm -f -- "$file"
                continue
              fi
              FILE="$file" python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["FILE"])
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          out = []
          i = 0
          while i < len(lines):
              if not lines[i].startswith("<<<<<<< "):
                  out.append(lines[i])
                  i += 1
                  continue
              i += 1
              while i < len(lines) and not lines[i].startswith("======="):
                  i += 1
              if i >= len(lines):
                  raise SystemExit(f"unterminated conflict in {path}")
              i += 1
              while i < len(lines) and not lines[i].startswith(">>>>>>> "):
                  out.append(lines[i])
                  i += 1
              if i >= len(lines):
                  raise SystemExit(f"unterminated conflict in {path}")
              i += 1
          path.write_text("".join(out), encoding="utf-8")
          PY
              git add -- "$file"
            done < <(git diff --name-only --diff-filter=U)
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            git status --short
            exit 1
          fi

          rm -f .github/workflows/_apply-pr75-revert.yml
          git add -A
          git commit -m "revert: remove aggressive dataplane watchdog"
          git push origin HEAD:revert/pr75-dataplane-watchdog
