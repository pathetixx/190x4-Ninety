name: Finish PR 75 revert

on:
  push:
    branches:
      - revert/pr75-dataplane-watchdog-v2
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'revert/pr75-dataplane-watchdog-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revert/pr75-dataplane-watchdog-v2

      - name: Remove aggressive watchdog integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The first branch already resolved the post-PR75 JavaScript lifecycle
          # integration without retaining autonomous dataplane recovery.
          git checkout origin/revert/pr75-dataplane-watchdog -- \
            src/lib/health-watchdog.js \
            src/lib/quality-engine.js \
            src/main.js \
            tests/health-watchdog.test.mjs \
            tests/quality.test.mjs

          mkdir -p /tmp/desired
          cp src-tauri/src/vpn.rs /tmp/desired/vpn.rs
          echo '' | base64 -d > /tmp/transform_vpn.py
          python /tmp/transform_vpn.py
          cp /tmp/desired/vpn.rs src-tauri/src/vpn.rs

          # Format only the Rust workspace; normal CI performs the full checks.
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

          rm -f .github/workflows/_finish-pr75-revert.yml
          git add -A
          git commit -m "revert: detach autonomous dataplane recovery"
          git push origin HEAD:revert/pr75-dataplane-watchdog-v2
