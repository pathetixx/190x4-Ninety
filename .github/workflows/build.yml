name: Build Ninety

on:
  push:
    # Build only on tag pushes. We used to also listen on branches: [main] —
    # every release push (git push origin main --tags) triggered 2 parallel
    # builds of the same SHA. The main build "for validation" was fictional:
    # it ran in parallel with the tag build, not before it, so it protected
    # nothing. For ad-hoc runs without a tag there is workflow_dispatch.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A push to main + a tag on the same SHA trigger two runs in parallel. They
# fight over the same Swatinem/rust-cache key and the second one dies on
# "Restoring cache...". Queueing by SHA fixes it without manual cancel/rerun.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-cores:
    # Both cores are pure Go with cgo off, so windows/amd64 cross-compiles here
    # exactly as it would on a Windows runner - and off the critical path of the
    # expensive one. The pins live here as job env: the cache key and the build
    # scripts then read them from one place.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CORE_REPO: https://github.com/pathetixx/ninety-core.git
      CORE_TAG: v1.13.16-ninety.1
      CORE_SHA: 55815e1339ff2f858ad43e847a223341aab07dd7
      XRAY_REPO: https://github.com/XTLS/Xray-core.git
      XRAY_TAG: v26.7.28
      XRAY_SHA: 5ca6f4b7d4dc20a881d4330e498892697627ec0c
      BUILD_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,badlinkname,tfogo_checklinkname0,with_grpc
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      # Fall back to the module origin on proxy transport errors and retry
      # incomplete downloads. go.sum still verifies every fetched module.
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # The built-in cache keys off a go.sum in this repository, and there is
          # none: the cores are cloned inside the job. Cached below instead.
          cache: false

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          # Keyed by the pins themselves: the module graph can only change when
          # one of them does, so the cache is never stale and never silently wrong.
          key: go-mod-${{ env.CORE_SHA }}-${{ env.XRAY_SHA }}

      - name: Build the sing-box core from source
        run: |
          set -euo pipefail
          # Pin to an exact commit: git tags are movable. The binary ships in the
          # signed installer and runs under LocalSystem - supply chain is critical.
          echo "Cloning ninety-core $CORE_TAG…"
          git clone --depth 1 --branch "$CORE_TAG" "$CORE_REPO" core
          head="$(git -C core rev-parse HEAD)"
          if [ "$head" != "$CORE_SHA" ]; then
            echo "ninety-core $CORE_TAG = $head, expected $CORE_SHA (tag moved?)" >&2
            exit 1
          fi
          echo "Verified ninety-core commit $head."
          mkdir -p binaries
          cd core
          for attempt in 1 2 3; do
            if go build -trimpath -tags "$BUILD_TAGS" \
                 -ldflags "-s -w -buildid= -checklinkname=0 -X internal/godebug.defaultGODEBUG=multipathtcp=0 -X github.com/sagernet/sing-box/constant.Version=${CORE_TAG#v}" \
                 -o sing-box.exe ./cmd/sing-box; then
              break
            fi
            if [ "$attempt" = 3 ]; then echo "go build failed after 3 attempts" >&2; exit 1; fi
            sleep $((15 * attempt))
          done
          cp sing-box.exe ../binaries/sing-box-x86_64-pc-windows-msvc.exe
          echo "Built ninety-core $CORE_TAG ($(du -m sing-box.exe | cut -f1) MB)."

      - name: Build xray-core from source (xhttp bridge)
        run: |
          set -euo pipefail
          # xhttp nodes go through xray-core, the reference implementation of that
          # transport (two-core: sing-box -> loopback socks bridge -> xray). Pure
          # Go, static, no cronet. XTLS marks every 26.x as a prerelease; this is
          # the tag we build and audit, not whatever "latest" resolves to.
          echo "Cloning Xray-core $XRAY_TAG…"
          git clone --depth 1 --branch "$XRAY_TAG" "$XRAY_REPO" xray-core
          head="$(git -C xray-core rev-parse HEAD)"
          if [ "$head" != "$XRAY_SHA" ]; then
            echo "Xray-core $XRAY_TAG = $head, expected $XRAY_SHA (tag moved?)" >&2
            exit 1
          fi
          echo "Verified Xray-core commit $head."
          cd xray-core
          # Only what this snapshot still ships behind a fixed version. The rest of
          # the list this used to carry is now newer upstream than the pins were,
          # so re-applying it would downgrade. Mirrored in security.yml, where the
          # resulting binary is audited.
          go get github.com/klauspost/compress@v1.18.7
          go mod tidy
          for attempt in 1 2 3; do
            if go build -trimpath -ldflags "-s -w -buildid=" -o xray.exe ./main; then
              break
            fi
            if [ "$attempt" = 3 ]; then echo "xray build failed after 3 attempts" >&2; exit 1; fi
            sleep $((15 * attempt))
          done
          cp xray.exe ../binaries/xray-x86_64-pc-windows-msvc.exe
          echo "Built Xray-core $XRAY_TAG ($(du -m xray.exe | cut -f1) MB)."

      - name: Upload engine binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engines
          path: binaries
          retention-days: 1

  build-windows:
    needs: build-cores
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Node preflight
        run: npm run preflight

      - name: Validate tag and version consistency
        run: npm run check:versions

      - name: Validate Windows installer resources
        run: npm run check:installer

      - name: Lint frontend
        run: npm run lint

      - name: Test selected-module coverage
        run: npm run test:coverage

      - name: Test release scripts
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Prepare sidecar placeholders for Rust tests
        shell: pwsh
        run: |
          # `cargo test` runs tauri-build before the heavy engine build steps.
          # tauri-build validates externalBin paths, so provide harmless
          # placeholders; real signed/verified sidecars overwrite them below.
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          foreach ($name in @(
            "sing-box-x86_64-pc-windows-msvc.exe",
            "xray-x86_64-pc-windows-msvc.exe",
            "naive-x86_64-pc-windows-msvc.exe",
            "trusttunnel_client-x86_64-pc-windows-msvc.exe"
          )) {
            New-Item -ItemType File -Force -Path "src-tauri/binaries/$name" | Out-Null
          }
          New-Item -ItemType File -Force -Path "src-tauri/binaries/wintun.dll" | Out-Null

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Restore engine binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engines
          path: src-tauri/binaries

      - name: Check generated configs against the core
        shell: pwsh
        run: |
          # The core rejects a config wholesale on a single unknown field, and a
          # config is only built on the user's machine. Generate the shapes we
          # actually ship - every mode, blocking, region, TLS tricks, WARP, strict
          # tunnel - and let the binary we just built validate them.
          node --import ./tests/register.mjs scripts/emit-sample-configs.mjs sample-configs
          $core = "src-tauri/binaries/sing-box-x86_64-pc-windows-msvc.exe"
          $failed = @()
          foreach ($file in Get-ChildItem sample-configs -Filter *.json) {
            & $core check -c $file.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $file.Name }
          }
          if ($failed.Count -gt 0) { Write-Error "core rejected: $($failed -join ', ')"; exit 1 }
          Write-Host "Core accepted all $((Get-ChildItem sample-configs -Filter *.json).Count) sample configs."

      - name: Download wintun.dll
        shell: pwsh
        run: |
          # Wintun — BSD-licensed user-mode driver by WireGuard. sing-box.exe
          # needs it for the TUN inbound (since alpha55 sing-box brings TUN up
          # itself, as a child of elevated Ninety — Throne-style). The DLL sits
          # next to Ninety.exe = next to sing-box.exe in the install dir;
          # sing-box loads it by name.
          $url = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          $expectedSha = "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile wintun.zip -UseBasicParsing
          # wintun.dll is loaded under LocalSystem — verify download integrity
          # (wintun.net ships no artifact signature, hence the sha256 pin).
          $sha = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $expectedSha) { Write-Error "wintun.zip sha256 = $sha, expected $expectedSha"; exit 1 }
          Write-Host "Verified wintun.zip sha256."
          Expand-Archive -Path wintun.zip -DestinationPath wintun -Force
          $src = "wintun/wintun/bin/amd64/wintun.dll"
          if (-not (Test-Path $src)) { Write-Error "wintun.dll not found after extraction"; exit 1 }
          Copy-Item $src "src-tauri/binaries/wintun.dll" -Force
          $size = (Get-Item "src-tauri/binaries/wintun.dll").Length
          Write-Host "wintun.dll bundled ($([math]::Round($size/1KB,1)) KB)."

      - name: Download protocol sidecars (naive + trusttunnel_client)
        shell: pwsh
        run: |
          # naive (klzgrad, BSD/Chromium stack) and trusttunnel_client (AdGuard,
          # Apache-2.0) — sidecar clients for naive/TrustTunnel nodes. Both listen
          # on a local SOCKS5; sing-box reaches them over a loopback bridge (like
          # xray for xhttp). Version pins + sha256 (releases ship unsigned).
          function Get-Sidecar($url, $sha, $zip, $exeName, $out) {
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $sha) { Write-Error "$zip sha256 = $h, expected $sha"; exit 1 }
            Write-Host "Verified $zip sha256."
            $dst = "extract-$exeName"
            Expand-Archive -Path $zip -DestinationPath $dst -Force
            $src = Get-ChildItem -Path $dst -Recurse -Filter $exeName | Select-Object -First 1
            if (-not $src) { Write-Error "$exeName not found in $zip"; exit 1 }
            Copy-Item $src.FullName $out -Force
            $size = (Get-Item $out).Length
            Write-Host "$exeName bundled ($([math]::Round($size/1MB,1)) MB)."
          }
          Get-Sidecar `
            "https://github.com/klzgrad/naiveproxy/releases/download/v148.0.7778.96-5/naiveproxy-v148.0.7778.96-5-win-x64.zip" `
            "54c7918557a7bd694f86ec7942b85d88b3623b21514ac3160c1e9e0e63175e8e" `
            naive.zip "naive.exe" "src-tauri/binaries/naive-x86_64-pc-windows-msvc.exe"
          Get-Sidecar `
            "https://github.com/TrustTunnel/TrustTunnelClient/releases/download/v1.0.49/trusttunnel_client-v1.0.49-windows-x86_64.zip" `
            "0e11150e77c083c828593e6fab7f76a159dd55b9ad9101dd70c4568da3cdf11b" `
            tt.zip "trusttunnel_client.exe" "src-tauri/binaries/trusttunnel_client-x86_64-pc-windows-msvc.exe"

      - name: Generate build-info (About page build id)
        shell: pwsh
        run: |
          # Bake the real commit/date/version into src/lib/build-info.js BEFORE
          # the build (frontendDist=../src, no bundler → the file ships as is).
          # core/channel/platform stay untouched — build-info.js is their single
          # source of truth (core is versioned next to the sing-box pin).
          $sha = (git rev-parse --short HEAD).Trim()
          $date = (Get-Date).ToUniversalTime().ToString("dd.MM.yyyy")
          $cfg = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $ver = $cfg.version
          $f = "src/lib/build-info.js"
          $c = Get-Content $f -Raw
          $c = $c -replace 'commit:\s*"[^"]*"', "commit: `"$sha`""
          $c = $c -replace 'date:\s*"[^"]*"', "date: `"$date`""
          $c = $c -replace 'version:\s*"[^"]*"', "version: `"$ver`""
          Set-Content $f $c -NoNewline
          Write-Host "build-info: version=$ver commit=$sha date=$date"

      - name: Configure Authenticode (optional)
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if (-not $hasCert -and -not $hasPassword) {
            "AUTHENTICODE_ENABLED=false" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Authenticode disabled: production certificate secrets are not configured."
            exit 0
          }
          if (-not $hasCert -or -not $hasPassword) {
            Write-Error "Both Authenticode secrets must be configured together."
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP "ninety-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object HasPrivateKey | Select-Object -First 1
          Remove-Item $pfx -Force
          if (-not $certificate) { Write-Error "PFX did not contain a certificate with a private key"; exit 1 }
          $path = "src-tauri/tauri.conf.json"
          $cfg = Get-Content $path -Raw | ConvertFrom-Json
          $cfg.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $certificate.Thumbprint -Force
          $cfg.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
          $cfg.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue "https://timestamp.digicert.com" -Force
          $cfg.bundle.windows | Add-Member -NotePropertyName tsp -NotePropertyValue $true -Force
          $cfg | ConvertTo-Json -Depth 100 | Set-Content $path -Encoding utf8
          "AUTHENTICODE_ENABLED=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Authenticode enabled with a production certificate from the CurrentUser store."

      - name: Compile pre-init installer language selector
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $makensis = @(
            "${env:ProgramFiles}\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe was not found after installation" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & $makensis /V3 "/DVERSION=$version" src-tauri/windows/kurogane/language-selector.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path src-tauri/windows/kurogane/kurogane-language.exe)) {
            throw "Pre-init language selector was not generated"
          }

      - name: Build Tauri
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Package Windows x64 Portable
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: Generate latest.json (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $cfg = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = $cfg.version
          $tag = "${{ github.ref_name }}"
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $nsis) { Write-Error "NSIS setup not found"; exit 1 }
          $sigPath = "$($nsis.FullName).sig"
          if (-not (Test-Path $sigPath)) { Write-Error "Signature not found: $sigPath"; exit 1 }
          $sig = (Get-Content $sigPath -Raw).Trim()
          $url = "https://github.com/pathetixx/190x4-Ninety/releases/download/$tag/$($nsis.Name)"
          # Pull the release body — proper changelogs for the custom update modal.
          # IMPORTANT: gh prints the body line by line → PowerShell turns it into
          # a string array and ConvertTo-Json then serializes an array. The Tauri
          # updater expects a string, otherwise latest.json parses as "no updates".
          # -join "`n" glues it back together.
          # Notes source, by priority — avoids the "release doesn't exist yet"
          # chicken-and-egg:
          #   1) tag annotation — ALWAYS available at build time (the release is created later);
          #   2) release body — fallback for re-runs when the release is already published;
          #   3) placeholder.
          # The previous version read ONLY the release body → on the first build the
          # notes went into latest.json empty (and thus into OTA/R2/GitLab too).
          # The annotated tag fixes that.
          $notes = ""
          # make sure the annotated tag object exists even on a shallow checkout
          git fetch origin "+refs/tags/$($tag):refs/tags/$($tag)" --force 2>$null
          $global:LASTEXITCODE = 0
          $tagMsg = (git tag -l $tag --format='%(contents)' 2>$null | Out-String).Trim()
          if (-not [string]::IsNullOrWhiteSpace($tagMsg)) { $notes = $tagMsg }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            try {
              $raw = gh release view $tag --json body --jq .body 2>$null
              if ($LASTEXITCODE -eq 0) {
                if ($raw -is [array]) { $notes = ($raw -join "`n") } else { $notes = [string]$raw }
              }
            } catch { $notes = "" }
            $global:LASTEXITCODE = 0
          }
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Release notes are not available." }
          # action-gh-release получает body из UTF-8-файла на раннере. Это
          # самовосстанавливает draft, если локальный gh/терминал повредил
          # кириллицу при создании релиза, и не зависит от code page процесса.
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8
          # Детерминированная дата аннотированного тега: повторный запуск того
          # же workflow создаёт байт-в-байт тот же immutable versioned metadata.
          $tagDate = (git for-each-ref --format='%(creatordate:iso8601-strict)' "refs/tags/$tag" | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($tagDate)) {
            $tagDate = (git show -s --format=%cI HEAD | Out-String).Trim()
          }
          $pubDate = ([DateTimeOffset]::Parse($tagDate)).UtcDateTime.ToString("yyyy-MM-ddTHH:mm:ssZ")
          $json = [ordered]@{
            version = $version
            notes = $notes
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path latest.json -Value $json -Encoding UTF8
          Write-Host "=== latest.json ==="
          Get-Content latest.json

      - name: Qualify Windows artifacts and smoke-test app
        shell: pwsh
        run: ./scripts/release-smoke.ps1

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-ninety.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ninety-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/portable/*_windows-x64-portable.zip
            sbom-ninety.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload release metadata
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ninety-release-metadata
          path: |
            latest.json
            release-notes.md
          if-no-files-found: error
          retention-days: 14

  release-on-tag:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ninety-windows
          path: artifacts/windows

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ninety-release-metadata
          path: artifacts/metadata

      - name: Restore release layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release/bundle/nsis
          mkdir -p src-tauri/target/release/bundle/msi
          mkdir -p src-tauri/target/release/portable
          find_one() {
            local pattern="$1"
            find artifacts/windows -type f -name "$pattern" -print -quit
          }
          nsis="$(find_one '*-setup.exe')"
          sig="$(find_one '*-setup.exe.sig')"
          msi="$(find_one '*.msi')"
          portable="$(find_one '*_windows-x64-portable.zip')"
          [[ -n "$nsis" && -n "$sig" && -n "$msi" && -n "$portable" ]]
          cp "$nsis" src-tauri/target/release/bundle/nsis/
          cp "$sig" src-tauri/target/release/bundle/nsis/
          cp "$msi" src-tauri/target/release/bundle/msi/
          cp "$portable" src-tauri/target/release/portable/
          cp artifacts/metadata/latest.json latest.json
          cp artifacts/metadata/release-notes.md release-notes.md
          cp "$(find_one 'sbom-ninety.cdx.json')" sbom-ninety.cdx.json

      # RU-reachable OTA fallback and release publication run only after the
      # read-only build/test job has completed successfully.
      - name: Mirror update to Cloudflare R2 (RU fallback)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ninety-updates
          R2_PUBLIC_URL: https://pub-d55ef44f89364070a9c55d8d0f9d825b.r2.dev
        run: |
          python -m pip install --quiet --no-deps -r ci/requirements-r2.txt
          python scripts/r2_mirror.py

      # RU-reachable OTA SOURCE: same .exe + latest.json (url→gitlab) in the
      # public project's GitLab generic package registry (unauthenticated download).
      # gitlab.com is reachable from RU, unlike r2.dev. This is the primary
      # endpoint in tauri.conf.json; GitHub is the backup. The R2 step above
      # stays for legacy builds ≤0.1.75 (they ship the [r2, github] order —
      # dropping R2 updates would strand their updater).
      - name: Mirror update to GitLab (RU source)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: "83749391"
        run: python scripts/gitlab_mirror.py

      # Публикация draft и переключение GitHub Latest разрешены только после
      # проверенного promotion основного GitLab stable/latest.json. Если любой
      # предыдущий шаг упал, draft остаётся draft, прежний GitHub Latest жив.
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Ninety ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/portable/*_windows-x64-portable.zip
            latest.json
            sbom-ninety.cdx.json
          fail_on_unmatched_files: true
          # prerelease MUST be false: the updater endpoint is releases/latest/
          # download/latest.json (a GitHub redirect to "Latest"), and GitHub
          # excludes prereleases from "Latest". prerelease:true → /latest/ serves
          # a stale latest.json → OTA breaks. Release title and notes stay
          # human-facing; tag scheme is semver vX.Y.Z.
          prerelease: false
          make_latest: "true"

      - name: Verify published GitHub and GitLab OTA
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          node scripts/release.mjs "$version" --verify
