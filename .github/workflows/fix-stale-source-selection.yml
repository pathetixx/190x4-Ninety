name: Apply source-switch and mode fixes

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stale-selection-proxy-mode
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/stale-source-selection'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy

      - name: Apply reviewed patch
        run: python scripts/apply_post_watchdog_source_mode_fix.py

      - name: Remove one-shot infrastructure
        shell: pwsh
        run: |
          Remove-Item scripts/apply_post_watchdog_source_mode_fix.py
          Remove-Item .github/workflows/fix-stale-source-selection.yml

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend preflight
        run: npm run preflight

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Frontend selected-module coverage
        run: npm run test:coverage

      - name: Prepare sidecar placeholders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          foreach ($name in @(
            'sing-box-x86_64-pc-windows-msvc.exe',
            'xray-x86_64-pc-windows-msvc.exe',
            'naive-x86_64-pc-windows-msvc.exe',
            'trusttunnel_client-x86_64-pc-windows-msvc.exe',
            'wintun.dll'
          )) {
            New-Item -ItemType File -Force -Path "src-tauri/binaries/$name" | Out-Null
          }

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Diff hygiene
        shell: pwsh
        run: |
          git diff --check
          $status = @(git status --porcelain)
          if ($status.Count -eq 0) {
            Write-Error 'Patch produced no changes'
            exit 1
          }
          $status | ForEach-Object { Write-Host $_ }

      - name: Commit tested patch to source branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: recover source switching and mode transitions'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
