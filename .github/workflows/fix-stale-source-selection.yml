name: Validate stale selection and proxy mode fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stale-selection-proxy-mode-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'fix/stale-source-selection'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend preflight
        run: npm run preflight

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Frontend selected-module coverage
        run: npm run test:coverage

      - name: Prepare sidecar placeholders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          foreach ($name in @(
            'sing-box-x86_64-pc-windows-msvc.exe',
            'xray-x86_64-pc-windows-msvc.exe',
            'naive-x86_64-pc-windows-msvc.exe',
            'trusttunnel_client-x86_64-pc-windows-msvc.exe',
            'wintun.dll'
          )) {
            New-Item -ItemType File -Force -Path "src-tauri/binaries/$name" | Out-Null
          }

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Diff hygiene
        shell: pwsh
        run: git diff --check origin/main...HEAD
