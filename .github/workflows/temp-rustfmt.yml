name: Temporary Rustfmt

on:
  push:
    branches:
      - agent/quality-probe-ipc-bounds

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/quality-probe-ipc-bounds

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "style: apply cargo fmt"
          git push origin HEAD:agent/quality-probe-ipc-bounds
