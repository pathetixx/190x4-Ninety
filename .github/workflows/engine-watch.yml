name: Engine watch (bol-van)

# winws engine watcher. Once a week it downloads the canonical binaries from
# bol-van/zapret-win-bundle (zapret-winws/) and compares them with our bundle
# in src-tauri/dpi/bin/. If the engine changed — opens a PR with the update.
# NO automerge: the kernel driver + .exe ship only after review → signed OTA.
# .bin payloads are NOT touched here (they come from the Flowseal data channel).

on:
  schedule:
    - cron: "37 5 * * 1" # weekly, Mon 05:37 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the engine from zapret-win-bundle
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/bol-van/zapret-win-bundle/master/zapret-winws"
          mkdir -p new
          for f in winws.exe WinDivert64.sys WinDivert.dll cygwin1.dll; do
            curl -fsSL -o "new/$f" "$base/$f"
          done

      - name: Compare with the bundle
        id: cmp
        run: |
          changed=0
          for f in winws.exe WinDivert64.sys WinDivert.dll cygwin1.dll; do
            a=$(sha256sum "new/$f" | awk '{print $1}')
            b=$(sha256sum "src-tauri/dpi/bin/$f" 2>/dev/null | awk '{print $1}')
            if [ "$a" != "$b" ]; then changed=1; echo "changed: $f"; fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          [ "$changed" = "0" ] && echo "engine is up to date" || true

      - name: Apply + open a PR
        if: steps.cmp.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in winws.exe WinDivert64.sys WinDivert.dll cygwin1.dll; do
            cp "new/$f" "src-tauri/dpi/bin/$f"
          done
          # engine-version.txt is only a fallback (runtime reads `winws --version`).
          date -u +'zapret engine %Y-%m-%d (bol-van)' > src-tauri/dpi/engine-version.txt
          branch="engine-bump-$(date -u +%Y%m%d-%H%M)"
          git config user.name "ninety-bot"
          git config user.email "noreply@190x4.pw"
          git checkout -b "$branch"
          git add src-tauri/dpi/bin/winws.exe src-tauri/dpi/bin/WinDivert64.sys \
                  src-tauri/dpi/bin/WinDivert.dll src-tauri/dpi/bin/cygwin1.dll \
                  src-tauri/dpi/engine-version.txt
          git commit -m "chore(engine): bump winws/WinDivert from bol-van/zapret-win-bundle"
          git push -u origin "$branch"
          gh pr create \
            --base main --head "$branch" \
            --title "winws engine update (bol-van)" \
            --body "Auto-PR: winws.exe/WinDivert changed in bol-van/zapret-win-bundle. Check \`engine-version.txt\` (the runtime reads the version from \`winws --version\` anyway) and merge → signed OTA release. \`.bin\` payloads are NOT touched — they come from the Flowseal data channel."
