name: Temporary rustfmt proxy

on:
  push:
    branches: [agent/proxy-rollback-current-state]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proxy-rollback-current-state
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: rm .github/workflows/temp-rustfmt-proxy.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/proxy_win.rs .github/workflows/temp-rustfmt-proxy.yml
          git commit -m "style: format proxy rollback transaction"
          git push origin HEAD:agent/proxy-rollback-current-state
