name: Temporary rustfmt backup

on:
  push:
    branches: [agent/backup-semantic-fallback]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/backup-semantic-fallback
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: rm .github/workflows/temp-rustfmt-backup.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/backup.rs .github/workflows/temp-rustfmt-backup.yml
          git commit -m "style: format semantic backup validation"
          git push origin HEAD:agent/backup-semantic-fallback
