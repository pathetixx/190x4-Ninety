name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  release:
    types: [published]
  workflow_run:
    workflows: ["Build Ninety"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Publishing a release via GITHUB_TOKEN doesn't create a separate release-event
    # workflow. workflow_run after Build Ninety guarantees a second Pages deploy
    # once the release has become Latest and release.json contains its assets.
    if: >-
      (github.event_name != 'release' || github.event.release.prerelease == false) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate latest release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
            --jq '{
              tag_name,
              html_url,
              published_at,
              assets: [.assets[] | {name, browser_download_url}]
            }' > site/release.json

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Publishing is a separate job: deploy-pages in the same job as the upload
  # sometimes doesn't find the freshly uploaded artifact (actions/deploy-pages#451).
  # The official Pages starters are built the same way; "Re-run failed jobs"
  # reruns only the publishing, without creating a second artifact.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
