name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Node preflight
        run: npm run preflight
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production and development dependency tree
        run: npm audit --audit-level=high

  rustsec-and-policy:
    name: RustSec and cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: RustSec advisory audit
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # post-v2.0.0 Node24 migration
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
      - name: Install cargo-deny
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-deny@0.19.0
          fallback: cargo-install
      - name: Check dependency policy
        working-directory: src-tauri
        run: cargo deny --workspace --all-features check --config ../deny.toml

  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript
          build-mode: none
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:javascript

  go-sidecars:
    name: Go sidecar dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Точный патч, а не '1.26': GOTOOLCHAIN=local запрещает Go подтянуть
          # более новую toolchain самому, поэтому stdlib ядра — ровно эта версия.
          # 1.26.6 закрывает GO-2026-5026/6088/6089/6090 (idna, encoding/xml,
          # net/http, crypto/tls), на которых 1.26.5 валил аудит sing-box.
          go-version: '1.26.6'
          cache: false
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Audit the pinned sing-box core
        shell: bash
        run: |
          set -euo pipefail
          tags="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,badlinkname,tfogo_checklinkname0,with_grpc"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          git clone --depth 1 --branch v1.13.18-ninety.1 https://github.com/pathetixx/ninety-core.git core
          test "$(git -C core rev-parse HEAD)" = f7242e40d144b22770cf6db630a5c0294eedbed0
          (
            cd core
            # То же обновление, что и в build.yml: аудит обязан смотреть на то
            # дерево зависимостей, из которого собирается релизный бинарь.
            GOTOOLCHAIN=local go get golang.org/x/mod@v0.40.0
            GOTOOLCHAIN=local go mod tidy
            CGO_ENABLED=0 GOTOOLCHAIN=local go build -trimpath -tags "$tags" -ldflags "-s -w -buildid= -checklinkname=0 -X internal/godebug.defaultGODEBUG=multipathtcp=0" -o "$tmpdir/sing-box" ./cmd/sing-box
            govulncheck -mode=binary -format=json "$tmpdir/sing-box" > "$tmpdir/sing-box-vulns.json"
            # GO-2026-5932 covers the unmaintained x/crypto/openpgp package. It has no fixed
            # version and is not imported by this entrypoint; keep it visible as a warning while
            # failing on every other function- or method-level finding.
            if jq -s -e '[ .[] | .finding? | select(. != null and .osv != "GO-2026-5932") | (.trace // [])[] | select(.function? != null or .receiver? != null) ] | length > 0' "$tmpdir/sing-box-vulns.json" >/dev/null; then
              echo "govulncheck found a vulnerability in a function or method present in the built binary"
              jq -s -r '.[] | .finding? | select(. != null and .osv != "GO-2026-5932") | . as $finding | (.trace // [])[] | select(.function? != null or .receiver? != null) | {osv: $finding.osv, modules: $finding.modules, trace: .}' "$tmpdir/sing-box-vulns.json"
              exit 1
            fi
            echo "govulncheck found no unallowlisted reachable function or method vulnerability in the built binary"
            jq -s -r '.[] | select(.finding?) | .finding | "module-only finding: \(.osv // "unknown")"' "$tmpdir/sing-box-vulns.json" | sort -u
          )
      - name: Audit pinned Xray core
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          git clone --depth 1 --branch v26.7.28 https://github.com/XTLS/Xray-core.git xray-core
          test "$(git -C xray-core rev-parse HEAD)" = 5ca6f4b7d4dc20a881d4330e498892697627ec0c
          (
            cd xray-core
            GOTOOLCHAIN=local go get github.com/klauspost/compress@v1.18.7
            GOTOOLCHAIN=local go mod tidy
            CGO_ENABLED=0 GOTOOLCHAIN=local go build -trimpath -ldflags "-s -w -buildid=" -o "$tmpdir/xray" ./main
            govulncheck -mode=binary -format=json "$tmpdir/xray" > "$tmpdir/xray-vulns.json"
            # GO-2026-5932 covers the unmaintained x/crypto/openpgp package. It has no fixed
            # version and is not imported by this entrypoint; keep it visible as a warning while
            # failing on every other function- or method-level finding.
            if jq -s -e '[ .[] | .finding? | select(. != null and .osv != "GO-2026-5932") | (.trace // [])[] | select(.function? != null or .receiver? != null) ] | length > 0' "$tmpdir/xray-vulns.json" >/dev/null; then
              echo "govulncheck found a vulnerability in a function or method present in the built binary"
              jq -s -r '.[] | .finding? | select(. != null and .osv != "GO-2026-5932") | . as $finding | (.trace // [])[] | select(.function? != null or .receiver? != null) | {osv: $finding.osv, modules: $finding.modules, trace: .}' "$tmpdir/xray-vulns.json"
              exit 1
            fi
            echo "govulncheck found no unallowlisted reachable function or method vulnerability in the built binary"
            jq -s -r '.[] | select(.finding?) | .finding | "module-only finding: \(.osv // "unknown")"' "$tmpdir/xray-vulns.json" | sort -u
          )
