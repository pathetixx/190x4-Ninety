name: Apply PR 75 revert v2

on:
  push:
    branches:
      - revert/pr75-dataplane-watchdog-v2

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revert/pr75-dataplane-watchdog-v2

      - name: Revert PR 75 while preserving later conflict regions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git revert --no-commit -m 1 3513add89f62cafc9d43031dcad5cd5438e073f1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            while IFS= read -r file; do
              if [ "$file" = "src-tauri/src/health.rs" ]; then
                git rm -f -- "$file"
              else
                git checkout --ours -- "$file"
                git add -- "$file"
              fi
            done < <(git diff --name-only --diff-filter=U)
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            git status --short
            exit 1
          fi

          rm -f .github/workflows/_apply-pr75-revert-v2.yml
          git add -A
          git commit -m "revert: remove aggressive dataplane watchdog"
          git push origin HEAD:revert/pr75-dataplane-watchdog-v2
