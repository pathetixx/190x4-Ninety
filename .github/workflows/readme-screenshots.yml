name: README screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/readme-screenshots.yml"
      - "scripts/readme-capture-bootstrap.js"
      - "scripts/capture-readme-window.ps1"
      - "src/**"
      - "src-tauri/src/**"
      - "src-tauri/tauri.conf.json"
      - "docs/home.png"
      - "docs/nodes.png"
      - "docs/profiles.png"
      - "docs/dpi.png"
      - "docs/settings.png"
      - "docs/logs.png"
      - "docs/quality.png"

permissions:
  contents: read

concurrency:
  group: readme-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          shared-key: readme-screenshots

      - name: Install dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Prepare inert sidecars and CI-only capture entrypoint
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          foreach ($name in @(
            "sing-box-x86_64-pc-windows-msvc.exe",
            "xray-x86_64-pc-windows-msvc.exe",
            "naive-x86_64-pc-windows-msvc.exe",
            "trusttunnel_client-x86_64-pc-windows-msvc.exe"
          )) {
            Set-Content -LiteralPath "src-tauri/binaries/$name" -Value "README screenshot fixture - never executed" -Encoding ascii
          }
          Set-Content -LiteralPath "src-tauri/binaries/wintun.dll" -Value "README screenshot fixture - never loaded" -Encoding ascii

          Copy-Item -LiteralPath scripts/readme-capture-bootstrap.js -Destination src/readme-capture-bootstrap.js -Force
          $index = Get-Content -LiteralPath src/index.html -Raw
          $needle = '<script type="module" src="/main.js"></script>'
          $replacement = '<script type="module" src="/readme-capture-bootstrap.js"></script>'
          if (-not $index.Contains($needle)) { throw "main.js entrypoint not found in src/index.html" }
          Set-Content -LiteralPath src/index.html -Value ($index.Replace($needle, $replacement)) -Encoding utf8

      - name: Build exact Tauri application
        shell: pwsh
        run: npm run tauri build -- --no-bundle

      - name: Capture real Ninety windows
        id: capture
        continue-on-error: true
        shell: pwsh
        run: |
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP "NinetyReadmeWebView"
          Remove-Item -LiteralPath $env:WEBVIEW2_USER_DATA_FOLDER -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path readme-screenshots | Out-Null
          & scripts/capture-readme-window.ps1 `
            -App ./src-tauri/target/release/ninety.exe `
            -OutputDirectory ./readme-screenshots 2>&1 | Tee-Object -FilePath readme-screenshots/capture.log
          exit $LASTEXITCODE

      - name: Package screenshots and diagnostics
        if: always()
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath readme-screenshots -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "README capture produced no files" }
          Write-Host "Packaging $($files.Count) files: $($files.Name -join ', ')"
          Compress-Archive -LiteralPath $files.FullName -DestinationPath readme-screenshots.zip -CompressionLevel Optimal -Force

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-screenshots-${{ github.sha }}
          path: readme-screenshots.zip
          if-no-files-found: error
          retention-days: 14

      - name: Fail when capture failed
        if: steps.capture.outcome != 'success'
        shell: pwsh
        run: throw "README screenshot capture failed; inspect capture.log in the uploaded artifact"
