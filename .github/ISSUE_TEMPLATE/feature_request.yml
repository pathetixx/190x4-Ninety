name: Feature request
description: Suggest an improvement or new feature for Ninety
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the user problem first, not only the implementation idea.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import / subscriptions
        - Connection modes
        - Node selection
        - Routing rules
        - WARP
        - DPI tools
        - Kill switch
        - Logs / diagnostics
        - Updater
        - Tray / autostart
        - UI / themes
        - Localization
        - Build / packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing or confusing right now?
      placeholder: I want to ... but currently ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention other workflows or tools you tried.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues for similar requests.
          required: true
        - label: This request does not require sharing private configs, keys or subscription data.
          required: true
