[target]
os = ["windows"]

[advisories]
# These advisories are currently transitive Tauri/wry dependencies with no
# patched release. GTK3/glib are Linux-only runtime dependencies; the other
# entries come from Tauri's shared utility graph. Keep the IDs explicit so a
# new RustSec advisory still appears in CI instead of being blanket-suppressed.
ignore = [
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0370",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0100",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2024-0429",
]
