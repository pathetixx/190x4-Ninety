[target]
os = ["windows"]

[advisories]
# These advisories are currently transitive Tauri/wry dependencies with no
# patched release. GTK3/glib are Linux-only runtime dependencies; the other
# entries come from Tauri's shared utility graph. Keep the IDs explicit so a
# new RustSec advisory still appears in CI instead of being blanket-suppressed.
ignore = [
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0370",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0100",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2024-0429",
  # zip 4.6.1 via tauri-plugin-updater 2.14.0 (no release on zip 9 yet).
  # Ninety ships v2 updater artifacts (signed NSIS .exe, no zip), and the
  # updater verifies the minisign signature before touching the payload.
  # Ninety's own zip is on the patched 9.x line. Drop once the plugin moves.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  # zvariant / zbus_names / zvariant_derive are unmaintained (merged into
  # zbus 6). They come only through zbus, the Linux D-Bus backend of
  # notify-rust and tauri-plugin-single-instance; the Windows build does not
  # use it. Drop once those crates move to zbus 6.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]
